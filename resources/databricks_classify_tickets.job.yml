# Databricks AI Functions Showcase - Simple Workflow
resources:
  jobs:
    ai_showcase_workflow:
      name: "AI Functions Showcase - Ticket Classification"
      description: "Demonstrates ai_classify, ai_extract, and ai_gen with ticket data"

      # Optional: Run on demand or schedule
      # trigger:
      #   periodic:
      #     interval: 1
      #     unit: DAYS

      # Email notifications for failures
      email_notifications:
        on_failure:
          - vik.malhotra@databricks.com
        on_success:
          - vik.malhotra@databricks.com

      # Job-level timeout
      timeout_seconds: 7200  # 2 hours total

      tasks:
        # Task 1: Generate Sample Data
        - task_key: "01_data_generation"
          description: "Generate realistic ticket data for AI processing"
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/01_sample_data_generation.ipynb"
            base_parameters:
              num_tickets: "10"
              data_quality: "realistic"
          timeout_seconds: 1800  # 30 minutes
          max_retries: 2
          retry_on_timeout: true

        # Task 2: AI Functions Showcase
        - task_key: "02_ai_showcase"
          description: "Comprehensive AI functions demonstration - ai_classify, ai_extract, ai_gen"
          job_cluster_key: job_cluster
          depends_on:
            - task_key: "01_data_generation"
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/02_ai_showcase.ipynb"
          timeout_seconds: 3600  # 60 minutes (AI processing)
          max_retries: 2
          retry_on_timeout: true

        # Task 3: Business Insights & Decision Making
        - task_key: "03_business_insights"
          description: "Transform AI analysis into actionable business decisions and dashboard data"
          job_cluster_key: job_cluster
          depends_on:
            - task_key: "02_ai_showcase"
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/03_business_insights.ipynb"
          timeout_seconds: 1800  # 30 minutes (analytics processing)
          max_retries: 2
          retry_on_timeout: true

      # Use traditional cluster instead of serverless environment
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D3_v2
            data_security_mode: SINGLE_USER
            autoscale:
              min_workers: 1
              max_workers: 4