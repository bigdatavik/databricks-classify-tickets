# Alternative workflow configuration for running notebooks in sequence
# This provides more flexibility and better error handling

resources:
  jobs:
    notebook_sequence_workflow:
      name: "Ticket Classification Workflow - Sequential Notebooks"
      description: "Runs the three notebooks in sequence: data generation → action extraction → AI classification"
      
      # Optional: Run on demand or schedule
      # trigger:
      #   periodic:
      #     interval: 1
      #     unit: DAYS

      # Email notifications for failures
      email_notifications:
        on_failure:
          - vik.malhotra@databricks.com
        on_success:
          - vik.malhotra@databricks.com

      # Job-level timeout
      timeout_seconds: 7200  # 2 hours total

      tasks:
        # Task 1: Generate Sample Data
        - task_key: "01_data_generation"
          description: "Generate realistic ticket data for processing"
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/01_sample_data_generation.ipynb"
            base_parameters:
              num_tickets: "10"
              data_quality: "realistic"
          timeout_seconds: 1800  # 30 minutes
          max_retries: 2
          retry_on_timeout: true

        # Task 2: AI Functions Showcase
        - task_key: "02_ai_showcase"
          description: "Comprehensive AI functions demonstration - ai_classify, ai_extract, ai_gen"
          depends_on:
            - task_key: "01_data_generation"
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/02_ai_showcase.ipynb"
          timeout_seconds: 3600  # 60 minutes (AI processing)
          max_retries: 2
          retry_on_timeout: true

      # Use traditional cluster instead of serverless environment
      # Jobs will use the default cluster or you can specify a cluster_id
      # cluster_id: "your-cluster-id"  # Uncomment and specify if you want a specific cluster
