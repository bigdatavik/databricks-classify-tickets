# Alternative workflow configuration for running notebooks in sequence
# This provides more flexibility and better error handling

resources:
  jobs:
    notebook_sequence_workflow:
      name: "Ticket Classification Workflow - Sequential Notebooks"
      description: "Runs the three notebooks in sequence: data generation → action extraction → AI classification"
      
      # Optional: Run on demand or schedule
      # trigger:
      #   periodic:
      #     interval: 1
      #     unit: DAYS

      # Email notifications for failures
      email_notifications:
        on_failure:
          - vik.malhotra@databricks.com
        on_success:
          - vik.malhotra@databricks.com

      # Job-level timeout
      timeout_seconds: 7200  # 2 hours total

      tasks:
        # Task 1: Generate Sample Data
        - task_key: "01_data_generation"
          description: "Generate realistic ticket data for processing"
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/01_sample_data_generation.ipynb"
            base_parameters:
              num_tickets: "10"
              data_quality: "realistic"
          timeout_seconds: 1800  # 30 minutes
          max_retries: 2
          retry_on_timeout: true

        # Task 2: Extract Action Items
        - task_key: "02_action_extraction"
          description: "Extract action items, priorities, and timelines using AI"
          depends_on:
            - task_key: "01_data_generation"
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/02_action_extraction.ipynb"
          timeout_seconds: 3600  # 60 minutes (AI processing)
          max_retries: 2
          retry_on_timeout: true

        # Task 3: AI Classification
        - task_key: "03_ai_classification"
          description: "Perform AI-powered classification and final processing"
          depends_on:
            - task_key: "02_action_extraction"
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/03_ai_classification.ipynb"
          timeout_seconds: 1800  # 30 minutes
          max_retries: 2
          retry_on_timeout: true

        # Task 4: Validation and Summary
        - task_key: "04_validation"
          description: "Validate results and generate summary report"
          depends_on:
            - task_key: "03_ai_classification"
          notebook_task:
            notebook_path: "../src/databricks_classify_tickets/validation_summary.ipynb"
          timeout_seconds: 900  # 15 minutes
          max_retries: 1

      # Environment configuration
      environments:
        - environment_key: "notebook_env"
          spec:
            dependencies:
              - "../dist/*.whl"
            # Add any additional libraries if needed
            # libraries:
            #   - pypi:
            #       package: "additional-package"
